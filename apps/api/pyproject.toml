[project]
name = "pmis-api"
version = "0.1.0"
description = "PMIS backend: quản trị và giám sát dự án đầu tư công"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyjwt>=2.8",
    "pwdlib[argon2]>=0.2",
    "cryptography>=43",
    "email-validator>=2.1",
    "python-multipart>=0.0.9",
    # Đọc EXIF GPS và kiểm ảnh hiện trường (E10). Ghim để kết quả đọc EXIF ổn định.
    "pillow==11.3.0",
    # Ghim phiên bản cụ thể cho tích hợp Google Drive và hàng đợi nền (ARQ, kéo theo redis).
    "google-api-python-client==2.201.0",
    "google-auth==2.62.0",
    "arq==0.28.0",
    # OAuth người dùng để ghi lên Drive (tài khoản dịch vụ không có quota trong My Drive).
    "google-auth-oauthlib==1.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "httpx>=0.27",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "unit: test thuần, không cần database",
    "integration: test cần PostgreSQL thật (TEST_DATABASE_URL)",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
# S105/S106 báo nhầm tên hằng như TOKEN_ISSUER hay "bearer" là mật khẩu hardcode.
ignore = ["S105", "S106"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dùng Depends() trong default argument là cách chuẩn.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Security"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "B008"]
# Migration do Alembic sinh tự động, không sửa tay về độ dài dòng.
"migrations/**" = ["E501"]
