services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pmis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pmis}
      POSTGRES_DB: pmis
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pmis -d pmis"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build: ./apps/api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://pmis:${POSTGRES_PASSWORD:-pmis}@db:5432/pmis
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ./apps/api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://pmis:${POSTGRES_PASSWORD:-pmis}@db:5432/pmis
      REDIS_URL: redis://redis:6379/0
    command: ["python", "-m", "arq", "app.worker.settings.WorkerSettings"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
